map $http_x_forwarded_proto $atlas_proto {
    default $scheme;
    https https;
}
# Browsers can omit Origin on the initial same-origin polling GET. Preserve
# supplied origins; infer one only when the browser declares same-origin.
map "$http_origin|$http_sec_fetch_site" $atlas_socket_origin {
    default $http_origin;
    "|same-origin" "$atlas_proto://${ATLAS_SITE}";
}
server {
    listen 8080;
    server_name ${ATLAS_SITE};
    root /home/frappe/frappe-bench/sites;
    client_max_body_size 25m;
    location /assets/ {
        alias /srv/assets/;
        add_header X-Content-Type-Options nosniff;
    }
    location ~ ^/protected/(.*) {
        internal;
        try_files /${ATLAS_SITE}/$1 =404;
    }
    location /socket.io {
        proxy_pass http://websocket:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $atlas_socket_origin;
        proxy_set_header X-Frappe-Site-Name ${ATLAS_SITE};
        proxy_set_header X-Forwarded-Proto $atlas_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location / {
        try_files /${ATLAS_SITE}/public/$uri @backend;
    }
    location @backend {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Frappe-Site-Name ${ATLAS_SITE};
        proxy_set_header X-Forwarded-Proto $atlas_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
