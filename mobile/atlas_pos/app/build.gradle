plugins { id 'com.android.application' }

android {
    namespace 'com.atlasuse.pos'
    compileSdk 35
    defaultConfig {
        // Deliberately separate from a future enrolled production till.
        applicationId 'com.atlasuse.pos.preview'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview'
        testInstrumentationRunner 'com.atlasuse.pos.PreviewInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        // One canonical public demo dataset; do not maintain a second price list.
        main.assets.srcDirs = ['../../../apps/atlas_erp/atlas_erp/public/data']
    }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
